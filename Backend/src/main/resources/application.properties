spring.application.name=LIAProjekt

# ===== ENV VARIABLES =====
spring.cloud.azure.client-id=${AZURE_CLIENT_ID}
#spring.cloud.azure.service-principal.id=${SERVICE_PRINCIPLE_ID}

# ==== KEY VAULT =====
spring.cloud.azure.keyvault.secret.property-sources[0].endpoint=https://kv-app-dev01.vault.azure.net/
spring.cloud.azure.keyvault.secret.property-sources[0].credential.managed-identity-enabled=true

# ===== BLOB STORAGE =====
spring.cloud.azure.storage.blob.account-name=${AZURE_STORAGE_ACCOUNT_NAME}
spring.cloud.azure.storage.account-key=${AZURE_STORAGE_ACCOUNT_KEY}
spring.cloud.azure.storage.container-name-pdf=${AZURE_STORAGE_CONTAINER_NAME_PDF}
spring.cloud.azure.storage.container-name-video=${AZURE_STORAGE_CONTAINER_NAME_VIDEO}
spring.cloud.azure.storage.sas-expiry-minutes=60
spring.cloud.azure.storage.frontdoor-endpoint=${AZURE_STORAGE_FRONTDOOR_ENDPOINT}

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

stream.token.secret=${STREAM_TOKEN_SECRET}
stream.token.ttl-seconds=300


# ===== GRAPH =====
graph.base-url=https://graph.microsoft.com/v1.0
graph.scope=https://graph.microsoft.com/.default

# ===== FRONTEND =====
app.redirect.frontend=${APP_REDIRECT_FRONTEND}

# ===== JWT VALIDATION (FRONTEND TOKENS) =====
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://sts.windows.net/${AZURE_TENANT_ID}/

# =========================
# DATABASE
# =========================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}

# =========================
# JPA / HIBERNATE
# =========================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT}

# Mail sender
azure.graph.mail-user=no-reply@CampusMolndal.onmicrosoft.com

# ===== OpenAI CONFIG =====
azure.openai.endpoint=https://oai-app-dev01.openai.azure.com
azure.openai.api-version=2024-08-01-preview
azure.openai.assistant-id=${AZURE_OPENAI_ASSISTANT_ID}
azure.openai.api-key=${AZURE_OPENAI_API_KEY}


# ===== POLLING CONFIG =====
azure.openai.poll.max-attempts=30
azure.openai.poll.interval-ms=2000


# ====================
# LOCAL TESTING
# ====================

# Enable/disable outgoing emails with true/false, True for prod
app.email.enabled=true

# Allow anonymous users during local testing
app.allow-anonymous-events=false

test.properties=false