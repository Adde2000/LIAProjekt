spring.application.name=LIAProjekt

# ===== ENV VARIABLES =====
spring.cloud.azure.tenant-id=1
spring.cloud.azure.credential.client-id=2
spring.cloud.azure.credential.client-secret=3

# ==== KEY VAULT =====
spring.cloud.azure.keyvault.secret.property-sources[0].endpoint=https://kv-app-dev01.vault.azure.net/
spring.cloud.azure.keyvault.secret.property-sources[0].credential.managed-identity-enabled=false

# ===== BLOB STORAGE =====
spring.cloud.azure.storage.blob.account-name=abc
spring.cloud.azure.storage.account-key=bcd
spring.cloud.azure.storage.container-name-pdf=cde
spring.cloud.azure.storage.container-name-video=def
spring.cloud.azure.storage.sas-expiry-minutes=60
spring.cloud.azure.storage.frontdoor-endpoint=https://thisisnottheendpoint.azurefd.net

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# ===== GRAPH =====
graph.base-url=https://graph.microsoft.com/v1.0
graph.scope=https://graph.microsoft.com/.default

# ===== JWT VALIDATION (FRONTEND TOKENS) =====
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://sts.windows.net/1/

# ===== DATABASE CONFIG =====
#CHANGE THIS TO MATCH PROPER DATABASE
spring.datasource.url=jdbc:h2:mem:test_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Mail sender
azure.graph.mail-user=no-reply@CampusMolndal.onmicrosoft.com

test.properties=true