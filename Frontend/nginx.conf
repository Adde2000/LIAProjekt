# nginx.conf — production reverse proxy
#
# The frontend (dist/) and backend run behind the same nginx host so all
# requests are same-origin. The service worker can intercept /api/material/stream/*
# and inject the Authorization header before the request leaves the browser.

server {
    listen 80;
    server_name your-domain.com;

    # Serve the built React app
    root /var/www/learning-portal/dist;
    index index.html;

    # ── Content Security Policy ─────────────────────────────────────────────
    # default-src covers everything not explicitly listed below.
    # media-src  : allows the Azure Front Door CDN endpoint to serve video streams.
    # frame-src  : allows the same CDN endpoint to be embedded in <iframe> for PDFs.
    # connect-src: allows fetch() calls to the API and the CDN (range requests).
    # blob:      : required for object URLs created from fetched blobs (PDF viewer).
    # ────────────────────────────────────────────────────────────────────────
    add_header Content-Security-Policy
        "default-src 'self'; \
         script-src 'self' 'unsafe-inline'; \
         style-src 'self' 'unsafe-inline'; \
         img-src 'self' data: https://*.azurefd.net https://*.blob.core.windows.net; \
         media-src 'self' https://*.azurefd.net https://*.blob.core.windows.net; \
         frame-src 'self' https://*.azurefd.net https://*.blob.core.windows.net; \
         connect-src 'self' https://*.azurefd.net https://*.blob.core.windows.net; \
         worker-src 'self' blob:; \
         font-src 'self' data:;"
        always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy all API requests to the Spring Boot backend
    location /api/ {
        proxy_pass         http://localhost:8080;
        proxy_http_version 1.1;

        # Required for streaming / chunked responses
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Pass Range headers through for video seeking
        proxy_set_header   Range             $http_range;
        proxy_set_header   If-Range          $http_if_range;
        proxy_no_cache     1;
    }
}
